name: Release guard

# حرس التجميد: يمنع أي مسار يصل منه تحديث للمستخدمين على الفرع الرئيسي
# بدون موافقة صريحة مكتوبة في docs/release_approval.md.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-guard:
    name: Freeze guard (no user-facing updates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify update freeze and absence of any publishing pipeline
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          problems = []
          approval_file = pathlib.Path('docs/release_approval.md')
          approved = approval_file.exists() and \
              'approved: true' in approval_file.read_text(encoding='utf-8')

          update_src = pathlib.Path('lib/services/update_service.dart').read_text(encoding='utf-8')
          flag_on = re.search(r'kUpdatesEnabled\s*=\s*true', update_src) is not None
          build_gate = 'AZKARI_ALLOW_UPDATES' in update_src
          if flag_on and not approved:
              problems.append('kUpdatesEnabled=true بدون docs/release_approval.md')
          if not build_gate:
              problems.append('حماية البناء (AZKARI_ALLOW_UPDATES) مفقودة من update_service.dart')

          publish_tokens = ('gh release create', 'action-gh-release', 'softprops/action-gh-release')
          for wf in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              text = wf.read_text(encoding='utf-8')
              for token in publish_tokens:
                  if token in text and not approved:
                      problems.append(f'{wf.name}: يحتوي "{token}" (نشر إصدار) بدون موافقة')
              if 'AZKARI_ALLOW_UPDATES=true' in text and not approved:
                  problems.append(f'{wf.name}: يبني مع تفعيل التحديثات بدون موافقة')

          app_version = re.search(
              r'^version:\s*(\S+)',
              pathlib.Path('pubspec.yaml').read_text(encoding='utf-8'),
              re.M,
          ).group(1)
          local_build = int(app_version.split('+')[1]) if '+' in app_version else 0
          remote = json.loads(pathlib.Path('version.json').read_text(encoding='utf-8'))
          remote_build = int(remote.get('build_number', 0))
          if remote_build > local_build and not approved:
              problems.append(
                  f'version.json يعلن build {remote_build} أعلى من التطبيق ({local_build}) بدون موافقة')

          if problems:
              for p in problems:
                  print(f'::error::{p}')
              sys.exit(1)
          print('Freeze guard OK: لا تحديثات ولا نشر بدون موافقة صريحة.')
          PY
