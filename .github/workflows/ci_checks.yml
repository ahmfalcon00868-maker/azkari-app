name: Code checks

# فحوصات سريعة (تحليل + اختبارات) تعمل على كل فرع، منفصلة عن بناء الـ APK.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Release guard (freeze must stay on)
        run: python3 tool/release_guard.py

      - name: Analyze (errors are fatal, warnings/infos are reported)
        run: |
          set -uo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.log 2>&1 || true
          python3 tool/analyze_summary.py analyze.log

      - name: TEMP diagnostics — analyzer errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f analyze_errors.txt ]; then
            head -c 55000 analyze_errors.txt > /tmp/errs.txt
            gh issue create --repo "$GITHUB_REPOSITORY" --title "temp-analyze-errors" --body-file /tmp/errs.txt || true
          fi

      - name: Run tests
        id: tests
        run: |
          set -uo pipefail
          flutter test --reporter json > test_report.json 2>&1 || true
          python3 tool/test_stats.py test_report.json

      - name: TEMP diagnostics — failing tests
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "== failures =="
            cat test_failures.txt 2>/dev/null | head -40
            echo "== tail of report =="
            tail -c 20000 test_report.json 2>/dev/null | tr ',' '\n' | grep -E '"message"|"error"|"stackTrace"' | head -40
          } > /tmp/f.txt
          head -c 55000 /tmp/f.txt > /tmp/f2.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "temp-test-failures" --body-file /tmp/f2.txt || true
