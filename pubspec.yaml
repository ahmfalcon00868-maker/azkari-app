name: azkari
description: تطبيق أذكاري - أذكار وأدعية وسبحة إلكترونية يعمل بدون إنترنت (Offline First)
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  just_audio: ^0.9.38
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4
  flutter_overlay_window: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
