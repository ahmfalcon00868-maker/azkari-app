name: Code checks

# فحوصات سريعة (تحليل + اختبارات) تعمل على كل فرع، منفصلة عن بناء الـ APK.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Release guard (freeze must stay on)
        run: python3 tool/release_guard.py

      - name: Analyze (errors are fatal, warnings are not)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
