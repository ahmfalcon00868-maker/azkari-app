name: Build Azkari v1.0.0 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# صلاحية قراءة فقط: هذا المسار لا يستطيع نشر Release أو تعديل الإصدارات إطلاقاً.
permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Azkari v1.0.0 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android platform files
        run: flutter create --org com.flc --project-name azkari --platforms=android .

      - name: Apply custom Android sources (home widgets & volume keys)
        run: |
          if [ -d android_custom ]; then
            cp -R android_custom/. android/
          fi

      - name: Ensure speech_to_text dependency in pubspec.yaml
        run: |
          python3 -c '
          p = "pubspec.yaml"
          txt = open(p, encoding="utf-8").read()
          if "speech_to_text:" not in txt:
              txt = txt.replace("dependencies:\n", "dependencies:\n  speech_to_text: ^7.0.0\n", 1)
              open(p, "w", encoding="utf-8").write(txt)
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Assert trailer version is 1.1.0+2
        run: |
          V=$(python3 -c "import re;print(re.search(r'^version:\s*(\S+)', open('pubspec.yaml',encoding='utf-8').read(), re.M).group(1))")
          echo "pubspec version = $V"
          test "$V" = "1.1.0+2"

      - name: Run unit tests (blocks the APK if anything fails)
        id: tests
        run: |
          set -euo pipefail
          flutter test --reporter json > test_report.json
          python3 - <<'PY'
          import json

          passed = 0
          failed = 0
          with open('test_report.json', encoding='utf-8') as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      event = json.loads(line)
                  except Exception:
                      continue
                  if event.get('type') == 'testDone' and not event.get('hidden'):
                      if event.get('result') == 'success':
                          passed += 1
                      else:
                          failed += 1
          with open('test_stats.txt', 'w', encoding='utf-8') as out:
              out.write(f"count={passed + failed}\npassed={passed}\nfailed={failed}\n")
          print(f"tests: {passed + failed} total, {passed} passed, {failed} failed")
          PY
          cat test_stats.txt >> "$GITHUB_OUTPUT"
          grep -qx 'failed=0' test_stats.txt

      - name: Configure Android assets, permissions, and Gradle
        run: |
          python3 -c '
          import os, re, shutil
          if os.path.exists("assets/audio/splash_ayah.mp3"):
              os.makedirs("android/app/src/main/res/raw", exist_ok=True)
              shutil.copy("assets/audio/splash_ayah.mp3", "android/app/src/main/res/raw/splash_ayah.mp3")
          os.makedirs("android/app/src/main/res/raw", exist_ok=True)
          open("android/app/src/main/res/raw/keep.xml", "w", encoding="utf-8").write("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources xmlns:tools=\"http://schemas.android.com/tools\" tools:keep=\"@drawable/ic_notification,@raw/splash_ayah\" />\n")
          if os.path.exists("assets/images/ic_notification.png"):
              os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
              shutil.copy("assets/images/ic_notification.png", "android/app/src/main/res/drawable/ic_notification.png")
          mp = "android/app/src/main/AndroidManifest.xml"
          m = open(mp, encoding="utf-8").read()
          m = re.sub("android:label=\"[^\"]*\"", "android:label=\"أذكاري\"", m, count=1)
          m = m.replace("android:name=\".MainActivity\"", "android:name=\"com.ryanheise.audioservice.AudioServiceActivity\"", 1)
          # كل الاتصالات في التطبيق HTTPS (تم التحقق: لا يوجد أي http:// في lib أو assets)
          # لذلك نزيل أي سماح عام بـ HTTP بدل تفعيله.
          m = re.sub(r"\s*android:usesCleartextTraffic=\"[^\"]*\"", "", m)
          if "xmlns:tools" not in m:
              m = m.replace("<manifest ", "<manifest xmlns:tools=\"http://schemas.android.com/tools\" ", 1)
          # لا يوجد أي تكامل إعلاني: نزيل صلاحية AD_ID التي تضيفها مكتبات طرف ثالث.
          if "com.google.android.gms.permission.AD_ID" not in m:
              adid = "\n    <uses-permission android:name=\"com.google.android.gms.permission.AD_ID\" tools:node=\"remove\"/>\n"
              m = m.replace("<application", adid + "<application", 1)
          perms = "\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\"/>\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_SPECIAL_USE\"/>\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>\n"
          if "SYSTEM_ALERT_WINDOW" not in m:
              m = m.replace("<application", perms + "<application", 1)
          if "android.speech.RecognitionService" not in m:
              q_tag = "\n    <queries><intent><action android:name=\"android.speech.RecognitionService\" /></intent></queries>\n"
              m = m.replace("<application", q_tag + "<application", 1)
          svcs = "\n        <service android:name=\"flutter.overlay.window.flutter_overlay_window.OverlayService\" android:foregroundServiceType=\"specialUse\" android:exported=\"false\"><property android:name=\"android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE\" android:value=\"Floating Zikr Reminder Overlay\"/></service>\n        <service android:name=\"com.ryanheise.audioservice.AudioService\" android:foregroundServiceType=\"mediaPlayback\" android:stopWithTask=\"false\" android:exported=\"true\"><intent-filter><action android:name=\"android.media.browse.MediaBrowserService\" /></intent-filter></service>\n        <receiver android:name=\"com.ryanheise.audioservice.MediaButtonReceiver\" android:exported=\"true\"><intent-filter><action android:name=\"android.intent.action.MEDIA_BUTTON\" /></intent-filter></receiver>\n        <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />\n        <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\"><intent-filter><action android:name=\"android.intent.action.BOOT_COMPLETED\"/><action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\"/></intent-filter></receiver>\n"
          if "OverlayService" not in m:
              m = m.replace("</application>", svcs + "</application>", 1)
          widgets = "\n        <receiver android:name=\"com.flc.azkari.TasbihWidgetProvider\" android:exported=\"true\"><intent-filter><action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\"/><action android:name=\"com.flc.azkari.TASBIH_WIDGET_INC\"/><action android:name=\"com.flc.azkari.TASBIH_WIDGET_NEXT\"/></intent-filter><meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/widget_tasbih_info\"/></receiver>\n        <receiver android:name=\"com.flc.azkari.AyahWidgetProvider\" android:exported=\"true\"><intent-filter><action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\"/></intent-filter><meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/widget_ayah_info\"/></receiver>\n"
          if "TasbihWidgetProvider" not in m:
              m = m.replace("</application>", widgets + "</application>", 1)
          open(mp, "w", encoding="utf-8").write(m)
          kts = "android/app/build.gradle.kts"
          grv = "android/app/build.gradle"
          if os.path.exists(kts):
              g = open(kts, encoding="utf-8").read()
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", g)
              # منع R8 من حذف موارد الإشعارات (ic_notification / splash_ayah)
              if "isShrinkResources" not in g and "buildTypes {" in g:
                  g = g.replace("buildTypes {", "buildTypes {\n        release {\n            isShrinkResources = false\n        }\n", 1)
              if "desugar_jdk_libs" not in g:
                  g += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
              open(kts, "w", encoding="utf-8").write(g)
          elif os.path.exists(grv):
              g = open(grv, encoding="utf-8").read()
              if "coreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "coreLibraryDesugaringEnabled true", 1)
              g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", g)
              if "shrinkResources" not in g and "buildTypes {" in g:
                  g = g.replace("buildTypes {", "buildTypes {\n        release {\n            shrinkResources false\n        }\n", 1)
              if "desugar_jdk_libs" not in g:
                  g += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"
              open(grv, "w", encoding="utf-8").write(g)
          '

      - name: Use pre-installed NDK to avoid slow/corrupt downloads
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          PRE_NDK=$(ls -1 "$SDK_DIR/ndk" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$PRE_NDK" ]; then
            echo "Using pre-installed NDK: $PRE_NDK"
            if [ -f "android/app/build.gradle.kts" ]; then
              sed -i "s/ndkVersion = .*/ndkVersion = \"$PRE_NDK\"/" android/app/build.gradle.kts
            elif [ -f "android/app/build.gradle" ]; then
              sed -i "s/ndkVersion .*/ndkVersion \"$PRE_NDK\"/" android/app/build.gradle
            fi
          fi

      - name: Configure Facebook SDK & Internet Permission
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
        run: |
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">أذكاري</string>\n    <string name="facebook_app_id">%s</string>\n    <string name="fb_login_protocol_scheme">fb%s</string>\n    <string name="facebook_client_token">%s</string>\n</resources>\n' "$FB_APP_ID" "$FB_APP_ID" "$FB_CLIENT_TOKEN" > android/app/src/main/res/values/strings.xml
          python3 -c '
          mp = "android/app/src/main/AndroidManifest.xml"
          m = open(mp, encoding="utf-8").read()
          if "android.permission.INTERNET" not in m:
              m = m.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\"/>\n<application", 1)
          fb_meta = "\n        <meta-data android:name=\"com.facebook.sdk.ApplicationId\" android:value=\"@string/facebook_app_id\"/>\n        <meta-data android:name=\"com.facebook.sdk.ClientToken\" android:value=\"@string/facebook_client_token\"/>\n"
          if "com.facebook.sdk.ApplicationId" not in m:
              m = m.replace("</application>", fb_meta + "</application>", 1)
          open(mp, "w", encoding="utf-8").write(m)
          '

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/azkari-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=azkari-release.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 -c '
          import os
          kts = "android/app/build.gradle.kts"
          grv = "android/app/build.gradle"
          if os.path.exists(kts):
              txt = open(kts, encoding="utf-8").read()
              imports = "import java.util.Properties\nimport java.io.FileInputStream\n\n"
              props = "val keystoreProperties = Properties().apply {\n    val f = rootProject.file(\"key.properties\")\n    if (f.exists()) load(FileInputStream(f))\n}\n\nandroid {"
              txt = imports + txt.replace("android {", props, 1)
              sc = "signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties.getProperty(\"keyAlias\")\n            keyPassword = keystoreProperties.getProperty(\"keyPassword\")\n            storeFile = file(keystoreProperties.getProperty(\"storeFile\"))\n            storePassword = keystoreProperties.getProperty(\"storePassword\")\n        }\n    }\n    buildTypes {"
              txt = txt.replace("buildTypes {", sc, 1)
              txt = txt.replace("signingConfig = signingConfigs.getByName(\"debug\")", "signingConfig = signingConfigs.getByName(\"release\")")
              open(kts, "w", encoding="utf-8").write(txt)
          elif os.path.exists(grv):
              txt = open(grv, encoding="utf-8").read()
              props = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {"
              txt = txt.replace("android {", props, 1)
              sc = "signingConfigs {\n        release {\n            keyAlias keystoreProperties[\"keyAlias\"]\n            keyPassword keystoreProperties[\"keyPassword\"]\n            storeFile file(keystoreProperties[\"storeFile\"])\n            storePassword keystoreProperties[\"storePassword\"]\n        }\n    }\n    buildTypes {"
              txt = txt.replace("buildTypes {", sc, 1)
              txt = txt.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              open(grv, "w", encoding="utf-8").write(txt)
          '

      - name: Generate Launcher Icon
        run: |
          if [ -f "assets/images/app_icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Verify shipped manifest (no cleartext HTTP, no AD_ID)
        run: |
          set -e
          MERGED=$(find build/app/intermediates -path "*merged*" -name AndroidManifest.xml | head -n 1)
          echo "merged manifest: $MERGED"
          test -n "$MERGED"
          if grep -q 'usesCleartextTraffic="true"' "$MERGED"; then
            echo "::error::cleartext HTTP is still allowed in the shipped manifest"
            exit 1
          fi
          if grep -q 'com.google.android.gms.permission.AD_ID' "$MERGED"; then
            echo "::error::AD_ID permission is still present in the shipped manifest"
            exit 1
          fi
          grep -q 'com.flc.azkari.TasbihWidgetProvider' "$MERGED"
          echo "manifest hardened ✔"

      - name: Verify signature & compute checksums
        id: apk
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -1 "$SDK_DIR"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          test -n "$CERT"
          echo "APK SHA-256:  $SHA"
          echo "Signer SHA-256: $CERT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert=${CERT:0:16}" >> "$GITHUB_OUTPUT"
          cp "$APK" "Azkari-1.1.0+2.apk"

      - name: Upload APK as workflow artifact only (no release, no publish)
        uses: actions/upload-artifact@v4
        with:
          name: Azkari-1.1.0-2-sha256-${{ steps.apk.outputs.sha }}-cert-${{ steps.apk.outputs.cert }}-tests-${{ steps.tests.outputs.count }}
          path: Azkari-1.1.0+2.apk
          if-no-files-found: error
